# Configuration for po/i18n.sh (sourced by bash).
DOMAIN=mainuan-install-appimage
PACKAGE_NAME=mainuan-install-appimage
PACKAGE_VERSION=$(sed -n 's/^Version: //p' "$ROOT/DEBIAN/control")
BUGS_ADDRESS=https://github.com/mainuan/mainuan-install-AppImage/issues
# ITS rules for packaging/*.policy and packaging/appimage-mime.xml ship in
# po/its, so extraction and msgfmt --xml do not depend on polkit or
# shared-mime-info development files being installed.
export GETTEXTDATADIRS="$PODIR${GETTEXTDATADIRS:+:$GETTEXTDATADIRS}"
